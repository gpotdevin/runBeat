# F-Droid inclusion request (sample metadata)

Copy this into the [F-Droid data repository](https://gitlab.com/fdroid/fdroiddata)
as `metadata/com.RunBeat.run.audio.yml` and submit a merge request.

```yaml
Categories:
  - Local Media Player
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Guillaume Potdevin
WebSite: https://github.com/gpotdevin/runBeat
SourceCode: https://github.com/gpotdevin/runBeat
IssueTracker: https://github.com/gpotdevin/runBeat/issues

AutoName: RunBeat

RepoType: git
Repo: https://github.com/gpotdevin/runBeat.git

Binaries: https://github.com/gpotdevin/runBeat/releases/download/v%v/app-release.apk

Builds:
  - versionName: 1.5.4
    versionCode: 33
    commit: c7392859a6837ae84eee99f1b975fa9581eb123d
    subdir: app
    gradle:
      - assembleFdroidRelease
    ndk: r26b

  - versionName: 2.0
    versionCode: 47
    commit: bd1ca37
    subdir: app
    gradle:
      - assembleFdroidRelease
    ndk: r26b

AllowedAPKSigningKeys: 17c79696d6cd7f28e9ae9b8931dc8b7c402856318fe450ec777a23fddf12ca02

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: build-counter.txt|(\d+)
CurrentVersion: 2.0
CurrentVersionCode: 47
```

> The versionCode is read from `build-counter.txt` — a manually incremented counter, not the
> git commit count — bumped once per release. It is the single source of truth for `versionCode`
> (`app/build.gradle` reads it at build time) and for F-Droid's `UpdateCheckData`.
