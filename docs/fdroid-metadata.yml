# F-Droid inclusion request (sample metadata)

Copy this into the [F-Droid data repository](https://gitlab.com/fdroid/fdroiddata)
as `metadata/com.RunBeat.run.audio.yml` and submit a merge request.

```yaml
Categories:
  - Local Media Player
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Guillaume Potdevin
WebSite: https://github.com/gpotdevin/runBeat
SourceCode: https://github.com/gpotdevin/runBeat
IssueTracker: https://github.com/gpotdevin/runBeat/issues

AutoName: RunBeat

RepoType: git
Repo: https://github.com/gpotdevin/runBeat.git
Binaries: https://github.com/gpotdevin/runBeat/releases/download/v%v/app-release.apk
AllowedAPKSigningKeys: 17c79696d6cd7f28e9ae9b8931dc8b7c402856318fe450ec777a23fddf12ca02

Builds:
  - versionName: 1.5.2
    versionCode: 26
    commit: 6f09faed9f27476a476385e38164c05e21e8eb20
    subdir: app
    gradle:
      - yes
    rm:
      - app/libs/TarsosDSP-Android-latest-bin.jar

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: build-counter.txt|(\d+)|app/build.gradle|versionName\s+"([^"]+)"
CurrentVersion: 1.5.2
CurrentVersionCode: 26
```

> Note: The versionCode is derived from `git rev-list --count HEAD` at build
> time. `build-counter.txt` stores the versionCode at release time so that
> `fdroid checkupdates` can statically extract it via `UpdateCheckData`.
> Update `build-counter.txt` with the commit count before tagging each
> release.
