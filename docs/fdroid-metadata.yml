# F-Droid inclusion request (sample metadata)

Copy this into the [F-Droid data repository](https://gitlab.com/fdroid/fdroiddata)
as `metadata/com.RunBeat.run.audio.yml` and submit a merge request.

```yaml
Categories:
  - Local Media Player
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: Guillaume Potdevin
WebSite: https://github.com/gpotdevin/runBeat
SourceCode: https://github.com/gpotdevin/runBeat
IssueTracker: https://github.com/gpotdevin/runBeat/issues

AutoName: RunBeat

RepoType: git
Repo: https://github.com/gpotdevin/runBeat.git

Binaries: https://github.com/gpotdevin/runBeat/releases/download/v%v/app-release.apk

Builds:
  - versionName: 1.5.4
    versionCode: 33
    commit: c7392859a6837ae84eee99f1b975fa9581eb123d
    subdir: app
    gradle:
      - yes
    ndk: r26b

  # v1.8 tag commit (tag name matches versionName, so Binaries v%v resolves)
  # (v1.8 tag = 4f5b05f6087d844688dffd1a830d340bf333ae22)
  - versionName: "1.8"
    versionCode: 45
    commit: 4f5b05f6087d844688dffd1a830d340bf333ae22
    subdir: app
    gradle:
      - yes
    ndk: r26b

AllowedAPKSigningKeys: 17c79696d6cd7f28e9ae9b8931dc8b7c402856318fe450ec777a23fddf12ca02

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: build-counter.txt|(\d+)
CurrentVersion: "1.8"
CurrentVersionCode: 45
```

> Note: The versionCode is read from `build-counter.txt` to ensure consistency
> with F-Droid's UpdateCheckData. `build-counter.txt` is a manually incremented
> counter — not the git commit count — and must be bumped for each release. It is
> the single source of truth for `versionCode` (`app/build.gradle` reads it at
> build time).
