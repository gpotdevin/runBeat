plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-kapt'  // For Hilt
}

repositories {
    google()
    mavenCentral()
}

// Media3 1.11.x declares a kotlin-stdlib 2.2.10 dependency in its POM although
// its artifacts ship no Kotlin classes. This project compiles with Kotlin
// 1.9.22, which cannot read kotlin-stdlib 2.2 metadata, so keep the stdlib at
// the compiler's version (same classpath as before the Media3 upgrade).
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    }
}

android {
    namespace 'com.bpmapp.audio'
    compileSdk 36
    buildToolsVersion "34.0.0"
    ndkVersion "26.1.10909125"

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // versionCode is read from build-counter.txt to ensure consistency with F-Droid
    def counterFile = file("${project.rootDir}/build-counter.txt")
    def buildNumber = counterFile.exists() ? counterFile.text.trim().toInteger() : 1

    defaultConfig {
        applicationId "com.RunBeat.run.audio"
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Companion flavors: 'fdroid' is the default and stays free of any
    // proprietary dependency (it is the build F-Droid ships); 'garmin' adds
    // the Connect IQ Mobile SDK for the watch companion app. The garmin
    // flavor keeps applicationId com.RunBeat.run.audio (the Play Store
    // listing); the fdroid flavor uses the .fdroid suffix, so the two
    // flavors ARE co-installable side by side.
    flavorDimensions += 'companion'
    productFlavors {
        fdroid {
            dimension 'companion'
            applicationId "com.runBeat.run.audio.fdroid"
        }
        garmin {
            dimension 'companion'
        }
    }

    signingConfigs {
        release {
            // Signing secrets come from environment variables only (no secrets in the repo).
            // Set these via CI/CD or local environment:
            // BPM_RELEASE_STORE_FILE, BPM_RELEASE_STORE_PASSWORD,
            // BPM_RELEASE_KEY_ALIAS, BPM_RELEASE_KEY_PASSWORD
            storeFile file(System.getenv('BPM_RELEASE_STORE_FILE') ?: '../RunBeat.keystore')
            storePassword System.getenv('BPM_RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('BPM_RELEASE_KEY_ALIAS') ?: 'RunBeat_app'
            keyPassword System.getenv('BPM_RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
        viewBinding true
        // Generates BuildConfig (FLAVOR) — used to gate the Garmin companion
        // section in Settings to the garmin flavor.
        buildConfig true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Compose
    implementation "androidx.compose.ui:ui:1.5.3"
    implementation "androidx.compose.material3:material3:1.1.2"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.3"
    implementation "androidx.activity:activity-compose:1.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2"
    implementation "androidx.navigation:navigation-compose:2.7.4"
    implementation "androidx.compose.material:material-icons-extended:1.5.3"

    // Reorderable LazyColumn (drag-and-drop reordering)
    implementation 'sh.calvin.reorderable:reorderable:1.5.2'
    
    // ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media:media:1.6.0'
    
    // SoundTouch for time-stretching (LGPL)
    // Using hipxel/soundtouch-android library for high-quality time-stretching
    // Source: https://github.com/hipxel/soundtouch-android
    implementation project(':soundtouch-android')
    
    // JAudiotagger for reading/writing audio metadata tags (LGPL)
    implementation 'net.jthink:jaudiotagger:2.2.5'

    // Aubio library for BPM detection
    implementation project(':aubio')
    
    // Alternative: junyuecao wrapper (requires JitPack auth)
    // implementation 'io.github.junyuecao:soundtouch:1.0.1'

    // FFmpeg for audio format conversion (LGPL)
    // Note: mobile-ffmpeg and FFmpegKit have dependency resolution issues
    // For now, using Android's MediaCodec API which is built-in
    // To enable FFmpeg/FFmpegKit, uncomment one of these:
    // implementation 'com.arthenica:mobile-ffmpeg-min:4.4.LTS'
    // implementation 'com.arthenica:mobile-ffmpeg-full:4.4.LTS'
    // implementation 'com.arthenica:ffmpeg-kit-full:6.0-2.LTS'  // FFmpegKit (recommended)
    // And add appropriate repository if needed

    // Room (Database)
    implementation "androidx.room:room-runtime:2.6.0"
    implementation "androidx.room:room-ktx:2.6.0"
    kapt "androidx.room:room-compiler:2.6.0"
    
    // Hilt (Dependency Injection)
    implementation "com.google.dagger:hilt-android:2.48"
    kapt "com.google.dagger:hilt-compiler:2.48"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"
    
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"

    // Garmin Connect IQ Mobile SDK — garmin flavor only. The fdroid flavor
    // must stay free of proprietary dependencies (it is the F-Droid build).
    // Resolved from Maven Central (already declared in this module).
    garminImplementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.4.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.5.3'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.5.3'
    

    
    // AndroidX Test
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
