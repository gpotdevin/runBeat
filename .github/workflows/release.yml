name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release AAB
    runs-on: ubuntu-latest

    env:
      BPM_RELEASE_STORE_FILE: ${{ secrets.BPM_RELEASE_STORE_FILE }}
      BPM_RELEASE_STORE_PASSWORD: ${{ secrets.BPM_RELEASE_STORE_PASSWORD }}
      BPM_RELEASE_KEY_ALIAS: ${{ secrets.BPM_RELEASE_KEY_ALIAS }}
      BPM_RELEASE_KEY_PASSWORD: ${{ secrets.BPM_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake (for aubio native module)
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
            "ndk;25.1.8937393" "cmake;3.22.1" --sdk_root=$ANDROID_HOME
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties

      - name: Decode release keystore
        run: |
          echo "${{ secrets.BPM_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > bpm-release.keystore
          echo "BPM_RELEASE_STORE_FILE=${{ github.workspace }}/bpm-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") {found=1; next} found && index($0, "## [") {exit} found {print}' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          body_path: release_notes.md
