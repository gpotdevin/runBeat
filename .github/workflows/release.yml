name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish release AAB
    runs-on: ubuntu-latest

    env:
      BPM_RELEASE_STORE_FILE: ${{ secrets.BPM_RELEASE_STORE_FILE }}
      BPM_RELEASE_STORE_PASSWORD: ${{ secrets.BPM_RELEASE_STORE_PASSWORD }}
      BPM_RELEASE_KEY_ALIAS: ${{ secrets.BPM_RELEASE_KEY_ALIAS }}
      BPM_RELEASE_KEY_PASSWORD: ${{ secrets.BPM_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      - name: Set up Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/11.0/bin:$ANDROID_HOME/cmdline-tools/10.0/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1" --sdk_root=$ANDROID_HOME
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties

      - name: Decode release keystore
        run: |
          echo "${{ secrets.BPM_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > bpm-release.keystore
          echo "BPM_RELEASE_STORE_FILE=${{ github.workspace }}/bpm-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: |
          ./gradlew :app:assembleGarminRelease :app:assembleFdroidRelease :app:bundleGarminRelease
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Release artifacts must not expire on their own; retention is capped at
      # the last 3 per artifact kind by manual decision (see warning step below).
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/garminRelease/app-garmin-release.aab
          if-no-files-found: error
          retention-days: 400

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 400

      # Warns (never deletes): when a new release artifact is uploaded and more
      # than 3 artifacts of a kind are retained, a warning is printed to the log
      # and added to the run summary. Removing older artifacts is left to the user.
      - name: Warn if more than 3 release artifacts are retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in app-release-aab app-release-apk; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq "[.artifacts[] | select(.name == \"$name\" and .expired == false)] | length")
            if [ "$count" -gt 3 ]; then
              msg="::warning:: $count '$name' artifacts retained; policy is to keep only the last 3. Older artifacts might need to be removed manually (Actions tab > Artifacts)."
              echo "$msg"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0, "## [" v "]") {found=1; next} found && index($0, "## [") {exit} found {print}' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('reprotest-{0}', env.VERSION_CODE) || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            app/build/outputs/bundle/garminRelease/app-garmin-release.aab
            app/build/outputs/apk/garmin/release/app-garmin-release.apk
            app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          body_path: release_notes.md
